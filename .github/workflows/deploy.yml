name: OCI A1 capacity hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: oci-a1-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Write OCI CLI config
        shell: bash
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$TF_VAR_private_key" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$TF_VAR_user_ocid
          fingerprint=$TF_VAR_fingerprint
          tenancy=$TF_VAR_tenancy_ocid
          region=$TF_VAR_region
          key_file=$HOME/.oci/key.pem
          EOF

      - name: Check whether the instance already exists
        id: check
        shell: bash
        run: |
          COUNT=$(oci compute instance list \
            --compartment-id "$TF_VAR_compartment_ocid" \
            --display-name coolify-a1 \
            --query "length(data[?\"lifecycle-state\"!='TERMINATED'])" \
            --raw-output || true)
          COUNT=${COUNT:-0}
          echo "Existing coolify-a1 instances: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.exists == 'false'

      - name: Terraform init and validate
        if: steps.check.outputs.exists == 'false'
        run: |
          terraform init -input=false
          terraform validate

      - name: Retry until capacity is available (fault domain rotation)
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          # Rotation: 1) let Oracle choose, 2) FD-1, 3) FD-2, 4) FD-3, then repeat
          SLOTS=("" "FAULT-DOMAIN-1" "FAULT-DOMAIN-2" "FAULT-DOMAIN-3")
          UNEXPECTED=0

          for i in $(seq 1 55); do
            FD="${SLOTS[$(( (i - 1) % 4 ))]}"
            if [ -n "$FD" ]; then
              export TF_VAR_fault_domain="$FD"
            else
              unset TF_VAR_fault_domain
            fi

            echo "=== Attempt $i at $(date -u) [fault domain: ${FD:-oracle-chooses}] ==="
            if terraform apply -auto-approve -input=false 2>&1 | tee apply.log; then
              echo "SUCCESS - instance created. Find the public IP in OCI: Compute > Instances > coolify-a1"
              exit 0
            fi

            if grep -qE "401-NotAuthenticated|NotAuthorizedOrNotFound" apply.log; then
              echo "Authentication error - check the GitHub secrets"
              exit 1
            fi

            if grep -qi "Too many requests" apply.log; then
              UNEXPECTED=0
              echo "Rate limit reached. Sleeping 10 minutes..."
              sleep 600
            elif grep -qi "Out of host capacity" apply.log; then
              UNEXPECTED=0
              echo "Capacity limit hit. Retrying in 4 minutes..."
              sleep 240
            else
              UNEXPECTED=$((UNEXPECTED + 1))
              echo "Unexpected error ($UNEXPECTED in a row)"
              if [ "$UNEXPECTED" -ge 3 ]; then
                echo "Stopping: this is not a capacity problem, check the log above."
                exit 1
              fi
              sleep 240
            fi
          done
          echo "No capacity this round; the next scheduled run will try again."
          exit 0